name: runner-ipa
# Builds PhonedriverRunner for devices, unsigned, on a macOS machine, so a computer without Xcode (Windows, Linux)
# can drive an iPhone on iOS 17 to 26: the person signs and installs the .ipa with Sideloadly, and phonedriver
# starts it through testmanagerd (docs/architecture.md 7.3). Pushes to main publish it to the rolling `runner`
# release, the address `phonedriver ios setup` gives (crates/ios/src/runner.rs, RUNNER_IPA).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ios-runner/**
      - .github/workflows/runner-ipa.yml
  push:
    branches: [main]
    paths:
      - ios-runner/**
      - .github/workflows/runner-ipa.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the runner for devices, unsigned
        working-directory: ios-runner
        run: |
          xcodebuild -version
          xcodebuild build-for-testing \
            -project PhonedriverRunner.xcodeproj \
            -scheme PhonedriverRunner \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -quiet \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package PhonedriverRunner.ipa
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphoneos/PhonedriverRunner-Runner.app"
          test -x "$app/PhonedriverRunner-Runner"
          test -d "$app/PlugIns/PhonedriverRunner.xctest"
          # Without the copies Xcode bundles, XCTest's libraries load only from the device's mounted developer disk
          # image, never a mix of that version and this Xcode's. Appium leaves the same folder out of its unsigned
          # WebDriverAgent for devices (appium/WebDriverAgent Scripts/ci/build-real.sh).
          rm -rf "$app/Frameworks"
          # build-for-testing leaves the test bundle's debug symbols in PlugIns, where the device expects only plug-ins.
          find "$app" -name '*.dSYM' -prune -exec rm -rf {} +
          test -z "$(find "$app" -name '*.dSYM')"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/PhonedriverRunner.ipa" Payload)
          ls -la PhonedriverRunner.ipa
          unzip -l PhonedriverRunner.ipa | tail -n 40
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PhonedriverRunner-ipa
          path: PhonedriverRunner.ipa
          if-no-files-found: error
      - name: Publish to the rolling runner release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Unsigned PhonedriverRunner for iPhone and iPad, built from ${GITHUB_SHA} by the runner-ipa workflow. Sign and install it with Sideloadly and your Apple ID, then run \`phonedriver ios setup\`."
          if gh release view runner >/dev/null 2>&1; then
            gh release edit runner --notes "$notes"
          else
            gh release create runner --prerelease --title "PhonedriverRunner.ipa" --notes "$notes"
          fi
          gh release upload runner PhonedriverRunner.ipa --clobber
